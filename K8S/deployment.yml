
apiVersion: apps/v1
kind: Deployment

metadata:
  name: hotstar-deployment
  namespace: hotstar

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hotstar

  template:
    metadata:
      labels:
        app: hotstar

    spec:
      containers:
        - name: hotstar-container
          image: public.ecr.aws/e4i9q9h4/hotstar-clone:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
