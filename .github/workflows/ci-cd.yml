
name: Hotstar Clone React CI-CD

on:
  push:
    branches:
      - master

  workflow_dispatch:

# GitHub OIDC permissions
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  ECR_PUBLIC_REGION: us-east-1
  ECR_PUBLIC_REGISTRY: public.ecr.aws
  ECR_PUBLIC_REPOSITORY: public.ecr.aws/e4i9q9h4/hotstar-clone

jobs:

  # ==========================================
  # JOB 1: REACT BUILD, SONARQUBE AND NEXUS
  # ==========================================

  build:
    name: React Build and Code Quality
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build
        env:
          CI: "false"

      - name: Verify React Build
        run: |
          test -d build
          echo "React production build successful"
          ls -la build/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=hotstar-clone
            -Dsonar.projectName=hotstar-clone
            -Dsonar.sources=src
            -Dsonar.exclusions=build/**,node_modules/**

      - name: Create Build Artifact
        run: |
          zip -r hotstar-clone-build.zip build/

      - name: Upload Artifact to Nexus
        run: |
          curl --fail --show-error \
            -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file hotstar-clone-build.zip \
            "${{ secrets.NEXUS_RAW_REPO_URL }}/hotstar-clone/${GITHUB_RUN_NUMBER}/hotstar-clone-build.zip"

      - name: Build Job Completed
        run: echo "React build, SonarQube and Nexus completed"

  # ==========================================
  # JOB 2: DOCKER BUILD AND ECR PUBLIC PUSH
  # ==========================================

  docker:
    name: Docker Build and ECR Public Push
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # OIDC authentication
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::973294445442:role/GitHubHotstarDeployRole
          role-session-name: HotstarGitHubActions
          aws-region: ap-northeast-1
          audience: sts.amazonaws.com

      # Verify assumed role
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ECR Public authentication
      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password \
            --region us-east-1 \
          | docker login \
            --username AWS \
            --password-stdin public.ecr.aws

      # Docker build
      - name: Build Docker Image
        run: |
          docker build -t hotstar-clone:${GITHUB_SHA} .

      # Docker tagging
      - name: Tag Docker Image
        run: |
          docker tag hotstar-clone:${GITHUB_SHA} \
            ${ECR_PUBLIC_REPOSITORY}:${GITHUB_SHA}

          docker tag hotstar-clone:${GITHUB_SHA} \
            ${ECR_PUBLIC_REPOSITORY}:latest

      # Push to ECR Public
      - name: Push Docker Image to ECR Public
        run: |
          docker push ${ECR_PUBLIC_REPOSITORY}:${GITHUB_SHA}
          docker push ${ECR_PUBLIC_REPOSITORY}:latest

  # ==========================================
  # JOB 3: ECS FARGATE DEPLOYMENT
  # ==========================================

  deploy-ecs:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: docker

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::973294445442:role/GitHubHotstarDeployRole
          role-session-name: HotstarECSDeployment
          aws-region: ap-northeast-1

      - name: Verify ECS Cluster
        run: |
          aws ecs describe-clusters \
            --clusters hotstar-clone-cluster \
            --region ap-northeast-1

      - name: Render ECS Task Definition
        id: render-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: hotstar-clone
          image: public.ecr.aws/e4i9q9h4/hotstar-clone:${{ github.sha }}

      - name: Deploy to ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-container.outputs.task-definition }}
          service: hotstar-clone-service
          cluster: hotstar-clone-cluster
          wait-for-service-stability: true

  # ==========================================
  # JOB 4: EKS FARGATE DEPLOYMENT
  # ==========================================

  deploy-eks:
    name: Deploy to EKS Fargate
    runs-on: ubuntu-latest
    needs: docker

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::973294445442:role/GitHubHotstarDeployRole
          role-session-name: HotstarEKSDeployment
          aws-region: ap-northeast-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-northeast-1 \
            --name hotstar-clone-eks

      - name: Create Namespace If Not Exists
        run: |
          kubectl create namespace hotstar \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Deployment
        run: |
          kubectl apply -f k8s/deployment.yaml

      - name: Update Kubernetes Image
        run: |
          kubectl set image deployment/hotstar-clone \
            hotstar-clone=public.ecr.aws/e4i9q9h4/hotstar-clone:${GITHUB_SHA} \
            -n hotstar

      - name: Verify EKS Deployment
        run: |
          kubectl rollout status deployment/hotstar-clone \
            -n hotstar \
            --timeout=180s

          kubectl get pods -n hotstar -o wide
          kubectl get services -n hotstar

      - name: Deployment Completed
        run: |
          echo "Hotstar Clone ECS and EKS deployments completed"
