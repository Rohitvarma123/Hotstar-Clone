name: Build, publish, and deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hotstar-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hotstar-backend

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Ansible
        run: python -m pip install ansible
      - name: Deploy with Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          ansible-playbook ansible/playbook.yml -i ansible/inventory.ini \
            -e ansible_host="$DEPLOY_HOST" \
            -e ansible_user="${DEPLOY_USER:-ubuntu}" \
            -e ansible_ssh_private_key_file=deploy_key