
name: Hotstar Clone React CI-CD

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  ECR_PUBLIC_REGION: us-east-1
  ECR_PUBLIC_REGISTRY: public.ecr.aws
  ECR_PUBLIC_REPOSITORY: public.ecr.aws/e4i9q9h4/hotstar-clone

jobs:

  # =====================================
  # JOB 1: BUILD + SONARQUBE + NEXUS
  # =====================================

  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Create Build Artifact
        run: |
          zip -r hotstar-build.zip build/

      - name: Upload Artifact to Nexus
        run: |
          curl -f -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
          --upload-file hotstar-build.zip \
          "${{ secrets.NEXUS_RAW_REPO_URL }}/hotstar-build-${GITHUB_SHA}.zip"

  # =====================================
  # JOB 2: DOCKER BUILD + ECR PUSH
  # =====================================

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::973294445442:role/GitHubHotstarDeployRole
          aws-region: ${{ env.ECR_PUBLIC_REGION }}

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin public.ecr.aws

      - name: Build Docker Image
        run: |
          docker build -t $ECR_PUBLIC_REPOSITORY:${GITHUB_SHA} .
          docker tag $ECR_PUBLIC_REPOSITORY:${GITHUB_SHA} \
            $ECR_PUBLIC_REPOSITORY:latest

      - name: Push Docker Image to ECR Public
        run: |
          docker push $ECR_PUBLIC_REPOSITORY:${GITHUB_SHA}
          docker push $ECR_PUBLIC_REPOSITORY:latest

  # =====================================
  # JOB 3: DEPLOY TO AWS ECS
  # =====================================

  deploy-ecs:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::973294445442:role/GitHubHotstarDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ECS Cluster
        run: |
          aws ecs describe-clusters \
            --clusters hotstar-clone-cluster \
            --region $AWS_REGION

      - name: Update ECS Task Definition Image
        run: |
          sed -i "s|public.ecr.aws/e4i9q9h4/hotstar-clone:.*|$ECR_PUBLIC_REPOSITORY:${GITHUB_SHA}|g" \
            ecs-task-definition.json

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ecs-task-definition.json
          service: hotstar-clone-service
          cluster: hotstar-clone-cluster
          wait-for-service-stability: true

  # =====================================
  # JOB 4: DEPLOY TO AWS EKS
  # =====================================

  deploy-eks:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::973294445442:role/GitHubHotstarDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Connect to EKS Cluster
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name hotstar-clone-eks

      - name: Verify EKS Connection
        run: |
          kubectl get nodes

      - name: Create Namespace
        run: |
          kubectl create namespace hotstar \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Check Kubernetes Files
        run: |
          ls -la K8S/
          test -f K8S/deployment.yml
          test -f K8S/service.yml

      - name: Apply Kubernetes Deployment
        run: |
          kubectl apply -f K8S/deployment.yml -n hotstar

      - name: Update Kubernetes Image
        run: |
          kubectl set image deployment/hotstar-deployment \
            hotstar-container=$ECR_PUBLIC_REPOSITORY:${GITHUB_SHA} \
            -n hotstar

      - name: Apply Kubernetes Service
        run: |
          kubectl apply -f K8S/service.yml -n hotstar

      - name: Verify EKS Deployment
        run: |
          kubectl rollout status deployment/hotstar-deployment \
            -n hotstar \
            --timeout=180s

          kubectl get deployments -n hotstar
          kubectl get pods -n hotstar -o wide
          kubectl get services -n hotstar
