
name: Hotstar Clone React CI-CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: React Build and SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        run: npm run build
        env:
          CI: false

      - name: Verify Build
        run: |
          if [ -d "build" ]; then
            echo "React production build successful"
            ls -la build/
          else
            echo "Build directory not found"
            exit 1
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=hotstar-clone
            -Dsonar.projectName=hotstar-clone
            -Dsonar.sources=src
            -Dsonar.exclusions=build/**,node_modules/**

      - name: Create Build Artifact
        run: |
          zip -r hotstar-clone-build.zip build/

      - name: Upload Artifact to Nexus
        run: |
          curl -f -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
          --upload-file hotstar-clone-build.zip \
          "${{ secrets.NEXUS_RAW_REPO_URL }}/hotstar-clone/${GITHUB_RUN_NUMBER}/hotstar-clone-build.zip"

      - name: Pipeline Completed
        run: echo "Hotstar Clone CI pipeline completed successfully"
