apiVersion: apps/v1
kind: Deployment

metadata:
  name: hotstar-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hotstar-backend

  template:
    metadata:
      labels:
        app: hotstar-backend

    spec:
      containers:
        - name: hotstar-backend

          image: rohitvarmamuthyam/hotstar-backend:v1

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
