---
- name: Deploy Hotstar to Kubernetes
  hosts: kubernetes
  become: true
  vars:
    app_dir: /opt/hotstar
    frontend_image: "{{ lookup('env', 'FRONTEND_IMAGE') | default('sevenajay/hotstar-frontend:latest', true) }}"
    backend_image: "{{ lookup('env', 'BACKEND_IMAGE') | default('sevenajay/hotstar-backend:latest', true) }}"
  tasks:
    - name: Create application manifest directory
      ansible.builtin.file:
        path: "{{ app_dir }}/k8s"
        state: directory
        mode: '0755'
    - name: Copy Kubernetes manifests
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../backend/k8s/"
        dest: "{{ app_dir }}/k8s/"
        mode: '0644'
    - name: Apply Kubernetes manifests
      ansible.builtin.command:
        cmd: kubectl apply -f {{ app_dir }}/k8s/
      changed_when: true
    - name: Update frontend image
      ansible.builtin.command:
        cmd: kubectl set image deployment/hotstar-frontend hotstar-frontend={{ frontend_image }}
      changed_when: true
    - name: Update backend image
      ansible.builtin.command:
        cmd: kubectl set image deployment/hotstar-backend hotstar-backend={{ backend_image }}
      changed_when: true
    - name: Wait for frontend rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/hotstar-frontend --timeout=180s
      changed_when: false
    - name: Wait for backend rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/hotstar-backend --timeout=180s
      changed_when: false